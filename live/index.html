<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Robinhood Account</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%22-4 -4 32 32%22%3E%3Crect x=%22-4%22 y=%22-4%22 width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23CCFF00%22/%3E%3Cpath fill=%22%23000%22 d=%22M2.84 24h.53c.096 0 .192-.048.224-.128C7.591 13.696 11.94 8.656 14.67 5.638c.112-.128.064-.225-.096-.225h-4.88a.55.55 0 0 0-.45.225L5.746 9.972c-.514.642-.642 1.236-.642 2.086v4.43c-1.14 3.194-1.862 5.361-2.392 7.32-.032.125.016.192.129.192M20.447.646c-.754-.802-4.157-.834-5.73-.224a3 3 0 0 0-.786.465 41 41 0 0 0-3.323 3.178c-.112.113-.064.225.097.225h5.409c.497 0 .786.289.786.786v6.1c0 .16.128.208.225.064l3.258-4.254c.53-.69.69-.898.835-1.861.192-1.413.08-3.58-.77-4.479m-6.982 16.18 2.231-3.676a.7.7 0 0 0 .064-.29V6.73c0-.16-.112-.225-.224-.097-3.355 3.74-5.971 7.672-8.395 12.407-.06.12.016.225.16.177l5.009-1.54c.565-.174.882-.402 1.155-.852%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#F5F6F8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script defer src="../assets/core.js"></script>
<script defer src="../assets/live.js"></script>
</head>
<body>
<header class="top">
  <div class="top-in live-top">
    <a class="back-link" href="../"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>Paper portfolio</a>
    <span class="top-val num" id="topVal" aria-hidden="true"></span>
    <a class="brand rh-brand" href="./">
      <h1>Robinhood Account</h1>
      <span class="rh-mark" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M2.84 24h.53c.096 0 .192-.048.224-.128C7.591 13.696 11.94 8.656 14.67 5.638c.112-.128.064-.225-.096-.225h-4.88a.55.55 0 0 0-.45.225L5.746 9.972c-.514.642-.642 1.236-.642 2.086v4.43c-1.14 3.194-1.862 5.361-2.392 7.32-.032.125.016.192.129.192M20.447.646c-.754-.802-4.157-.834-5.73-.224a3 3 0 0 0-.786.465 41 41 0 0 0-3.323 3.178c-.112.113-.064.225.097.225h5.409c.497 0 .786.289.786.786v6.1c0 .16.128.208.225.064l3.258-4.254c.53-.69.69-.898.835-1.861.192-1.413.08-3.58-.77-4.479m-6.982 16.18 2.231-3.676a.7.7 0 0 0 .064-.29V6.73c0-.16-.112-.225-.224-.097-3.355 3.74-5.971 7.672-8.395 12.407-.06.12.016.225.16.177l5.009-1.54c.565-.174.882-.402 1.155-.852"/></svg></span>
    </a>
  </div>
</header>

<main class="wrap" id="main" aria-busy="true">
  <div class="meta-line" id="metaLine"><span>Loading your account…</span></div>

  <div class="grid two">
    <div class="stack">
      <section class="card hero" aria-labelledby="h-val">
        <div>
          <div class="eyebrow" id="h-val">Account balance</div>
          <div class="big num" id="val">—</div>
          <div class="delta num" id="pnlLine"></div>
        </div>
        <dl class="kpis num" id="kpis"></dl>
        <div>
          <div class="legend num" id="legend"></div>
          <div class="chart-box" id="valBox" style="height:220px"></div>
        </div>
      </section>

      <section class="card" aria-labelledby="h-hist">
        <div class="card-h"><div><h2 id="h-hist">History</h2><div class="sub">Every real trade. Tap one for why we took it, the plan, what happened and the charts.</div></div></div>
        <div id="hist"></div>
      </section>
    </div>

    <div class="stack">
      <section class="card" aria-labelledby="h-goal">
        <div class="card-h"><div><h2 id="h-goal">Road to the goal</h2><div class="sub" id="goalSub"></div></div></div>
        <div class="goal" id="goal"></div>
      </section>

      <section class="card" aria-labelledby="h-cmp">
        <div class="card-h"><div><h2 id="h-cmp">Account tracker</h2><div class="sub" id="trackSub">Balance, gain or loss, and trades so far</div></div></div>
        <dl class="track num" id="track"></dl>
      </section>

      <section class="card" aria-labelledby="h-open">
        <div class="card-h"><div><h2 id="h-open">Open positions</h2><div class="sub">Trades still running</div></div></div>
        <div id="open"></div>
      </section>
    </div>
  </div>

  <footer class="foot">
    <p id="source"></p>
  </footer>
</main>
</body>
</html>
