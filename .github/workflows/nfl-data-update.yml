name: NFL Dashboard Data Update

on:
  push:
    paths:
      - 'nfl/data/picks_log.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild data.json
        run: |
          cd nfl
          python3 build_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl/data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update NFL dashboard data [skip ci]"
            git push
          fi
