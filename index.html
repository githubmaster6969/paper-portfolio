<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Paper Portfolio Tracker</title>
<meta name=robots content=noindex>
<link rel=icon href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0b1020;--card:#141b2f;--tx:#e8ecf5;--mu:#8b95ad;--up:#22c55e;--dn:#ef4444;--ac:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
.w{max-width:1000px;margin:auto;padding:14px}h1{font-size:20px;margin:6px 0}.mu{color:var(--mu);font-size:12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:12px 0}
.big{font-size:32px;font-weight:700}.up{color:var(--up)}.dn{color:var(--dn)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.g .card{margin:0}
.lbl{font-size:12px;color:var(--mu)}.v{font-size:18px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 5px;border-bottom:1px solid #222b45;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{cursor:pointer;color:var(--mu);font-weight:500;user-select:none}.tw{overflow-x:auto}
button{background:var(--ac);color:#06142e;border:0;border-radius:10px;padding:8px 14px;font-weight:600}
.seg button{background:#222b45;color:var(--tx);margin:0 6px 6px 0;padding:6px 10px}.seg button.on{background:var(--ac);color:#06142e}
</style></head><body><div class=w>
<div style="display:flex;justify-content:space-between;align-items:center"><h1>📈 Paper Portfolio</h1><button id=rf>Refresh</button></div>
<div class=mu id=asof>Loading…</div>
<div class=card><div class=lbl>Total value (started $10,000 on Oct 9, 2026)</div><div class=big id=tot>–</div><div id=pl class=v></div><div class=mu id=vs></div></div>
<div class=g id=ports></div>
<div class=card><div class=lbl>Return % since start</div><div style="height:260px"><canvas id=lc></canvas></div></div>
<div class=card><div class=lbl>Allocation</div><div style="height:240px"><canvas id=pc></canvas></div></div>
<div class=card><div class=seg id=flt></div><div class=tw><table id=ht><thead><tr><th data-k=t>Ticker</th><th data-k=p>Port.</th><th data-k=price>Price</th><th data-k=value>Value</th><th data-k=pl>P/L $</th><th data-k=pct>P/L %</th><th data-k=sh>Shares</th><th data-k=buy>Buy</th></tr></thead><tbody></tbody></table></div></div>
<p class=mu id=src>Hypothetical paper portfolio, not real money and not financial advice.</p></div>
<script>
var N={S:'Safe Core',D:'Diversifier',A:'Aggressive AI & Energy'},C={S:'#60a5fa',D:'#a78bfa',A:'#f59e0b',T:'#22c55e',SPY:'#9ca3af'};
var lc,pc,rows=[],sk='value',sd=-1,fl='all';
function $(i){return document.getElementById(i)}
function m(x){return (x<0?'-$':'$')+Math.abs(x).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function p(x){return (x>=0?'+':'')+x.toFixed(2)+'%'}
function cl(x){return x>=0?'up':'dn'}
function draw(){var r=rows.filter(function(h){return fl=='all'||h.p==fl}).sort(function(a,b){var x=a[sk],y=b[sk];return (x>y?1:x<y?-1:0)*sd});
$('ht').tBodies[0].innerHTML=r.map(function(h){return '<tr><td><b>'+h.t+'</b></td><td>'+h.p+'</td><td>'+m(h.price)+'</td><td>'+m(h.value)+'</td><td class='+cl(h.pl)+'>'+m(h.pl)+'</td><td class='+cl(h.pct)+'>'+p(h.pct)+'</td><td>'+h.sh.toFixed(4)+'</td><td>'+m(h.buy)+'</td></tr>'}).join('')}
document.querySelectorAll('th').forEach(function(th){th.onclick=function(){var k=th.dataset.k;sd=(sk==k)?-sd:-1;sk=k;draw()}});
$('flt').innerHTML=['all','S','D','A'].map(function(k){return '<button data-f='+k+(k=='all'?' class=on':'')+'>'+(k=='all'?'All':N[k])+'</button>'}).join('');
$('flt').onclick=function(e){if(!e.target.dataset.f)return;fl=e.target.dataset.f;$('flt').querySelectorAll('button').forEach(function(b){b.className=b.dataset.f==fl?'on':''});draw()};
function load(){$('asof').textContent='Updating…';fetch('data/portfolio.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
rows=d.holdings.map(function(h){var v=h.sh*h.price,c=h.sh*h.buy;return {t:h.t,p:h.p,sh:h.sh,buy:h.buy,price:h.price,value:v,pl:v-c,pct:(v/c-1)*100}});
var pv={S:0,D:0,A:0},pcst={S:0,D:0,A:0};rows.forEach(function(h){pv[h.p]+=h.value;pcst[h.p]+=h.sh*h.buy});
var tot=pv.S+pv.D+pv.A,spy=d.spy.sh*d.spy.price;
$('tot').textContent=m(tot);$('pl').innerHTML='<span class='+cl(tot-1e4)+'>'+m(tot-1e4)+' ('+p((tot/1e4-1)*100)+')</span>';
$('vs').innerHTML='SPY benchmark ($10k): '+m(spy)+' <span class='+cl(spy-1e4)+'>('+p((spy/1e4-1)*100)+')</span> · You vs SPY: <b class='+cl(tot-spy)+'>'+p((tot-spy)/100)+'</b>';
$('ports').innerHTML=['S','D','A'].map(function(k){var r=(pv[k]/pcst[k]-1)*100;return '<div class=card><div class=lbl>'+N[k]+'</div><div class=v>'+m(pv[k])+'</div><div class='+cl(r)+'>'+p(r)+'</div></div>'}).join('')+'<div class=card><div class=lbl>SPY benchmark</div><div class=v>'+m(spy)+'</div><div class='+cl(spy-1e4)+'>'+p((spy/1e4-1)*100)+'</div></div>';
var s=d.series,base={S:pcst.S,D:pcst.D,A:pcst.A,T:10000,SPY:10000};
var ds=['T','SPY','S','D','A'].map(function(k){return {label:k=='T'?'Total':k=='SPY'?'SPY':N[k],data:s[k].map(function(v){return +((v/base[k]-1)*100).toFixed(2)}),borderColor:C[k],backgroundColor:C[k],borderWidth:k=='T'||k=='SPY'?3:1.5,pointRadius:2,tension:.2}});
if(lc)lc.destroy();
lc=new Chart($('lc'),{type:'line',data:{labels:d.dates,datasets:ds},options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#e8ecf5',boxWidth:10}},tooltip:{callbacks:{label:function(c){return c.dataset.label+': '+p(c.raw)}}}},scales:{x:{ticks:{color:'#8b95ad'}},y:{ticks:{color:'#8b95ad',callback:function(v){return v+'%'}},grid:{color:'#222b45'}}}}});
if(pc)pc.destroy();pc=new Chart($('pc'),{type:'doughnut',data:{labels:[N.S,N.D,N.A],datasets:[{data:[pv.S,pv.D,pv.A].map(function(v){return +v.toFixed(2)}),backgroundColor:[C.S,C.D,C.A],borderWidth:0}]},options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{color:'#e8ecf5'}},tooltip:{callbacks:{label:function(c){return c.label+': '+m(c.raw)+' ('+(c.raw/tot*100).toFixed(1)+'%)'}}}}}});
$('asof').textContent='Prices as of close '+d.lastClose+' · data updated '+new Date(d.asOf).toLocaleString('en-US',{timeZone:'America/New_York',dateStyle:'medium',timeStyle:'short'})+' ET · loaded '+new Date().toLocaleTimeString()+(d.failed.length?' · unavailable: '+d.failed.join(', '):'');
$('src').textContent=d.source+' Hypothetical paper portfolio, not real money and not financial advice.';draw()}).catch(function(e){$('asof').textContent='Could not load data: '+e})}
$('rf').onclick=load;load();
</script></body></html>
